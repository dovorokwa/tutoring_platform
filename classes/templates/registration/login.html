{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyTutor CAPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input {
            width: 100%;
            padding: 0.875rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="bg-blue-50/50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl shadow-blue-900/10 p-8 md:p-12 border border-white">
        
        <div class="text-center mb-10">
            <a href="/" class="inline-block mb-6">
                <img src="{% static 'images/logo.png' %}" alt="MyTutor Logo" class="h-10 mx-auto">
            </a>
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Welcome Back</h2>
            <p class="text-gray-500 mt-2 text-sm">Log in to continue your 2026 classes</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-2xl {% if message.tags == 'error' %}bg-red-50 text-red-800 border-red-100{% else %}bg-green-50 text-green-800 border-green-100{% endif %} border text-sm font-bold">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Email Address</label>
                <input type="email" name="username" required placeholder="Enter your email" autofocus>
            </div>

            <div>
                <div class="flex justify-between mb-2 ml-1">
                    <label class="text-sm font-bold text-gray-700">Password</label>
                    <a href="#" class="text-xs font-bold text-blue-600 hover:underline">Forgot?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-blue-800 transition-all shadow-xl shadow-blue-900/20 transform active:scale-[0.98]">
                Sign In
            </button>
        </form>

        <div class="text-center mt-10 pt-6 border-t border-gray-50">
            <p class="text-gray-500 text-sm">
                New to MyTutor? <a href="{% url 'register' %}" class="text-blue-600 font-bold hover:underline ml-1">Enroll Now</a>
            </p>
        </div>
    </div>

</body>
</html>
